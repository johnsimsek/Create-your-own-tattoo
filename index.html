<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Own Tattoo Design</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#fff;
  color:#000;
  margin:0;
  padding:0
}

.container{
  width:100%;
  padding:20px;
  box-sizing:border-box
}

label{display:block;margin-bottom:5px}
input[type=file]{margin-bottom:10px}

button{
  background:linear-gradient(to right,blue,pink,purple);
  border:none;
  color:white;
  padding:15px;
  width:100%;
  font-size:18px;
  border-radius:6px;
  cursor:pointer
}

#imageUnderButton{
  width:100%;
  margin-top:20px
}

/* ✅ Preview stage so overlays sit on top correctly */
#previewStage{
  position:relative;
  width:100%;
  max-width:900px;
  margin-top:20px;
  border:1px solid #ccc;
  overflow:hidden;
  border-radius:10px;
  background:#fafafa;
}

/* base image */
#bodyPlacementPreview{
  width:100%;
  height:auto;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
}

/* ✅ overlays (use class, NOT duplicated id) */
.tattooOverlay{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) translate(0px,0px) scale(1) rotate(0deg);
  mix-blend-mode:multiply;
  filter:grayscale(100%);
  touch-action:none;
  user-select:none;
  -webkit-user-drag:none;
  width:150px;
  will-change: transform;
}
</style>

</head>
<body>

<div class="container">
  <h1>Create Your Own Tattoo Design</h1>

  <!-- Keep form if you want, BUT we won't submit it -->
  <form id="tattooForm" onsubmit="return false;">
    <label>Upload Body Placement Image</label>
    <input type="file" id="bodyPlacement" accept="image/*" required>

    <label>Upload Tattoo Reference Images</label>
    <input type="file" id="tattooReferences" accept="image/*" multiple required>

    <!-- ✅ IMPORTANT: button is NOT submit -->
    <button type="button" id="createBtn">Create</button>
  </form>

  <img id="imageUnderButton" src="https://i.postimg.cc/63CPD2gN/1-Upload-Your-Body-Placement-Start-by-uploading-a-photo-of-the-area-where-you-want-your-tattoo-Thi.jpg" alt="Tattoo Guide">

  <!-- ✅ Preview stage -->
  <div id="previewStage"></div>
</div>

<script>
const createBtn = document.getElementById("createBtn");
const bodyInput = document.getElementById("bodyPlacement");
const tattooInput = document.getElementById("tattooReferences");
const stage = document.getElementById("previewStage");

createBtn.addEventListener("click", () => {
  const body = bodyInput.files[0];
  const tattoos = tattooInput.files;
  if(!body || !tattoos.length) return;

  stage.innerHTML = "";

  const base = document.createElement("img");
  base.src = URL.createObjectURL(body);
  base.id = "bodyPlacementPreview";
  base.alt = "Body Placement";
  stage.appendChild(base);

  Array.from(tattoos).forEach(file => {
    const img = document.createElement("img");
    img.className = "tattooOverlay";
    img.src = URL.createObjectURL(file);
    img.alt = "Tattoo Reference";
    stage.appendChild(img);
    enable(img);
  });
});

function enable(el){
  let x=0, y=0, s=1, r=0;
  let startX=0, startY=0, dist=null, angle=null;
  let mouseDown=false;

  const apply = () => {
    el.style.transform =
      `translate(-50%,-50%) translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;
  };

  // Touch start
  el.addEventListener("touchstart", (e) => {
    if(e.touches.length === 1){
      startX = e.touches[0].clientX - x;
      startY = e.touches[0].clientY - y;
    }else if(e.touches.length === 2){
      dist = getDist(e);
      angle = getAngle(e);
    }
  }, { passive:true });

  // Touch move (needs passive:false)
  el.addEventListener("touchmove", (e) => {
    e.preventDefault();

    if(e.touches.length === 1){
      x = e.touches[0].clientX - startX;
      y = e.touches[0].clientY - startY;
    }else if(e.touches.length === 2){
      const nd = getDist(e);
      const na = getAngle(e);

      if(dist){
        s *= (nd / dist);
        s = Math.max(0.15, Math.min(8, s));
        dist = nd;
      }
      if(angle !== null){
        r += (na - angle);
        angle = na;
      }
    }
    apply();
  }, { passive:false });

  el.addEventListener("touchend", () => {
    dist = null;
    angle = null;
  });

  // Desktop mouse drag (bonus)
  el.addEventListener("mousedown", (e) => {
    mouseDown = true;
    startX = e.clientX - x;
    startY = e.clientY - y;
  });

  window.addEventListener("mousemove", (e) => {
    if(!mouseDown) return;
    x = e.clientX - startX;
    y = e.clientY - startY;
    apply();
  });

  window.addEventListener("mouseup", () => {
    mouseDown = false;
  });

  function getDist(e){
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    return Math.hypot(dx, dy);
  }

  function getAngle(e){
    return Math.atan2(
      e.touches[1].clientY - e.touches[0].clientY,
      e.touches[1].clientX - e.touches[0].clientX
    ) * 180 / Math.PI;
  }

  apply();
}
</script>

</body>
</html>
